openapi: "3.0.0"
info:
  title: "Swagger Scheduler"
  version: "1.0.0"
paths:
  /email/exists:
    get:
      summary: "Check if verified email exists"
      parameters:
        - name: email
          in: query
          # allowReserved: true
          required: true
          schema:
            $ref: "#/components/schemas/Email"
      responses:
        "200":
          $ref: "#/components/responses/GetEmailExists200"
          description: "Check if user by specified email exist"
  /auth/signin:
    post:
      summary: "Sign in a user"
      requestBody:
        $ref: "#/components/requestBodies/AuthEmailCreds"
      responses:
        "200":
          $ref: "#/components/responses/User"
  /auth/signup:
    post:
      requestBody:
        $ref: "#/components/requestBodies/AuthEmailCreds"
      responses:
        "200":
          $ref: "#/components/responses/User"
  /auth/signout:
    post:
      responses:
        "204":
          description: "User signed out"
  /auth/verify:
    post:
      summary: "Verify email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  $ref: "#/components/schemas/Code"
                userId:
                  $ref: "#/components/schemas/Id"
              required:
                - code
                - userId
      responses:
        "200":
          description: OK
  /auth/session:
    get:
      summary: "Check user`s session"
      responses:
        "200":
          $ref: "#/components/responses/User"
  /auth/resend:
    post:
      summary: "Resend verification code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  $ref: "#/components/schemas/Email"
                userId:
                  $ref: "#/components/schemas/Id"
              required:
                - email
                - userId
      responses:
        "200":
          description: OK
  #*project endpoints
  /project:
    get:
      responses:
        "200":
          description: "Get user's public projects"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: "#/components/schemas/Id"
                    name:
                      type: string
                    createdBy:
                      $ref: "#/components/schemas/Id"
                    isPrivate:
                      type: boolean
                    lists:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          projectId:
                            type: string
                          createdAt:
                            type: string
                          createdBy:
                            type: string
                          isPrivate:
                            type: boolean
                        required:
                          - id
                          - name
                          - projectId
                          - createdAt
                          - createdBy
                          - isPrivate
                  required:
                    - id
                    - name
                    - createdBy
                    - lists
                    - isPrivate
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        "200":
          description: "Create project"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /project/private:
    get:
      responses:
        "200":
          description: "Get private project with private list"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: "#/components/schemas/Id"
                  name:
                    type: string
                  createdBy:
                    $ref: "#/components/schemas/Id"
                  isPrivate:
                    type: boolean
                  list:
                    $ref: "#/components/schemas/List"
                required:
                  - id
                  - name
                  - createdBy
                  - isPrivate
                  - list
  #*invitation endpoints
  /invitation:
    get:
      responses:
        "200":
          description: "Get invitations"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvitationDto"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                projectId:
                  type: string
              required:
                - email
                - projectId
      responses:
        "200":
          description: OK
  #*List endpoints
  /lists/{id}/tasks:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: "Get tasks"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskDto"
  /lists/{list_id}/tasks/{task_id}:
    put:
      parameters:
        - name: list_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - name: task_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                status:
                  $ref: "#/components/schemas/TaskStatus"
                priority:
                  $ref: "#/components/schemas/Priority"
                start_date:
                  type: string
                  nullable: true
                due_date:
                  type: string
                  nullable: true
                type:
                  $ref: "#/components/schemas/TaskType"
      responses:
        "200":
          description: "Update task"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDto"

  #*task endpoints
  /tasks:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFields"
      responses:
        "200":
          description: "Create task"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDto"
    delete:
      summary: Delete all trashed tasks
      responses:
        "200":
          description: OK
  /tasks/{id}:
    put:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskFields"
      responses:
        "200":
          description: "Update task fields"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDto"
    delete:
      summary: Delete trashed task by taskId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: OK
