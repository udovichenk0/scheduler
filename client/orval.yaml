  /tasks/{id}/trash:
    post:
      parameters:
        - name: id
          in: path
          schema:
            $ref: "#/components/schemas/Id"
          required: true
      responses:
        "200":
          description: OK

components:
  responses:
    GetEmailExists200:
      description: "Check if user is present with such email"
      content:
        application/json:
          schema:
            type: object
            properties:
              exists:
                type: boolean
            required:
              - exists
    User:
      description: "User response"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserDto"

  schemas:
    Description:
      type: string
      nullable: true
    StartDate:
      type: string
      nullable: true
    DueDate:
      type: string
      nullable: true
    Email:
      type: string
      format: email
      description: "Email address"
      minLength: 4
    Code:
      type: string
      minLength: 6
      maxLength: 6
    Id:
      type: string
      format: uuid
    UuidOrEmpty:
      oneOf:
        - type: string
          format: uuid
        - type: string
          enum: [""]
    UserDto:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        email:
          $ref: "#/components/schemas/Email"
        verified:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - email
        - verified
        - createdAt
    TaskStatus:
      type: string
      enum:
        - inprogress
        - finished
        - todo
    TaskType:
      type: string
      enum:
        - inbox
        - unplaced
    Project:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        createdBy:
          $ref: "#/components/schemas/Id"
        isPrivate:
          type: boolean
        lists:
          type: array
          items:
            $ref: "#/components/schemas/List"
      required:
        - id
        - name
        - createdBy
        - isPrivate
        - lists
    Priority:
      type: string
      enum:
        - none
        - low
        - normal
        - high
        - urgent
    TaskFields:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        start_date:
          type: string
          nullable: true
        due_date:
          type: string
          nullable: true
        list_id:
          type: string
        type:
          $ref: "#/components/schemas/TaskType"
      required:
        - title
        - description
        - status
        - start_date
        - due_date
        - type
        - priority
        - list_id
    TaskDto:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TaskStatus"
        start_date:
          type: string
          nullable: true
        due_date:
          type: string
          nullable: true
        user_id:
          $ref: "#/components/schemas/Id"
        list_id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/TaskType"
        date_created:
          type: string
        is_trashed:
          type: boolean
        priority:
          $ref: "#/components/schemas/Priority"
      required:
        - id
        - title
        - description
        - status
        - start_date
        - due_date
        - user_id
        - type
        - date_created
        - is_trashed
        - list_id
        - priority
    List:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdBy:
          $ref: "#/components/schemas/Id"
        projectId:
          $ref: "#/components/schemas/UuidOrEmpty"
        createdAt:
          type: string
        isPrivate:
          type: boolean
      required:
        - isPrivate
        - createdAt
        - projectId
        - createdBy
        - name
        - id

    InvitationDto:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        invitedBy:
          $ref: "#/components/schemas/Id"
        userId:
          $ref: "#/components/schemas/Id"
        projectId:
          $ref: "#/components/schemas/Id"
        invitedAt:
          type: string
      required:
        - id
        - invitedBy
        - userId
        - projectId
        - invitedAt

  requestBodies:
    AuthEmailCreds:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                $ref: "#/components/schemas/Email"
              password:
                type: string
            required:
              - email
              - password
