severity = "warning"          # or "error" if you want CI to fail on issues
confidence = 0.8
enableAllRules = false        # we enable rules explicitly below (cleaner)

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.deep-exit]
[rule.dot-imports]
[rule.duplicated-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.errorf]
[rule.if-return]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.imports-blacklist]
[rule.import-shadowing]
[rule.line-length-limit]
  arguments = [120]           # adjust if you prefer longer/shorter lines
[rule.modifies-parameter]
[rule.modifies-value-receiver]
# [rule.package-comments]       # ← keeps your original warning — good practice
[rule.range]
[rule.range-val-in-closure]
[rule.receiver-naming]
[rule.struct-tag]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-naming]
[rule.unexported-return]
[rule.unhandled-error]
[rule.unused-parameter]
[rule.unused-receiver]
[rule.var-declaration]
[rule.var-naming]
arguments = [[], [], [{ skipInitialismNameChecks = true }]]
[rule.exported]
arguments = [
  "disable-stuttering-check",
  "disableChecksOnFunctions",
  "disableChecksOnMethods",
  "disableChecksOnTypes",
  "disableChecksOnVariables",
  "disableChecksOnConstants"
]

exclude = [
  "vendor/**",
  "**/*_test.go",         # usually skip test files
  "**/*_mock.go",
  "**/*.pb.go",           # protobuf generated
  "**/*.gen.go",          # other generated files
]
